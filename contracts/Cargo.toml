[workspace]
resolver = "2"
members = ["types", "asset", "commons", "tests"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/anilkaracay/commonkit"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace.dependencies]
# pinned after research B1 (docs/RESEARCH_RESULTS.md)
near-sdk = { version = "5", default-features = true }
commonkit-types = { path = "types" }
