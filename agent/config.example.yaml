# Testnet mode. Copy to config.yaml and fill in the accounts from deployments/testnet.json.
# Keys never live in this file: per asset, env AGENT_KEY_<ALIAS> (function-call key), else the NEAR
# CLI keychain key that deployments/testnet.json lists for (agent, asset). Optional rephrasing:
# NEARAI_API_KEY, NEARAI_BASE_URL, NEARAI_MODEL.
network: testnet
agent_account: agent.commonkit-sxflo.testnet
chain: near
rpc_url: https://rpc.testnet.near.org
poll_seconds: 30
sync_every_seconds: 60
listen: { host: 127.0.0.1, port: 8788 }
cors_origins: ["http://localhost:5173"]
state_dir: state/testnet
evidence_dir: state/testnet/evidence
llm: { enabled: true }
deployments: ../deployments/testnet.json
assets:
  - asset_id: printer-01.makerlab.commonkit-sxflo.testnet
    alias: PRINTER_01                   # AGENT_KEY_PRINTER_01
    profile: ../profiles/printer_3d.json
    simulated: true                     # D-022: no hardware in the demo; the device is simulated
    supplier_is_team_account: true      # supplier.commonkit-sxflo.testnet is a team account
