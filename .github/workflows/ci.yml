name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (lint, typecheck, tests, profiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:profiles
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  contracts:
    name: Contracts (fmt, clippy, unit tests, wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - run: cargo fmt --manifest-path contracts/Cargo.toml --all -- --check
      # near-sdk's cfg guard rejects a plain host lib build; lint tests on host and the lib on wasm32
      - run: cargo clippy --manifest-path contracts/Cargo.toml --workspace --tests -- -D warnings
      - run: cargo clippy --manifest-path contracts/Cargo.toml -p commonkit-asset -p commonkit-commons --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml --workspace --exclude commonkit-integration-tests
      - run: bash scripts/build-contracts.sh
      # TEST_PLAN §3: every ABI method must have tests in contracts/tests/COVERAGE.md
      - run: cargo test --manifest-path contracts/Cargo.toml -p commonkit-integration-tests --test coverage
