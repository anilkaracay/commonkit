# Copy to config.yaml (gitignored). Values in ${...} come from the environment / .env.
network: testnet
rpc_url: ${NEAR_RPC_URL:-https://rpc.testnet.near.org}
bridge_account: ${BRIDGE_ACCOUNT_ID}
chain: near
listen: { host: 0.0.0.0, port: 8787 }
state_dir: state
evidence_dir: ../evidence
challenge_ttl_sec: 300
cors_origins: ["${WEB_ORIGIN:-http://localhost:5173}"]
# Writes: one function-call key per asset (a NEAR function-call key is bound to one receiver).
# Per asset: `signer_env: BRIDGE_KEY_<ALIAS>` (private key in .env), else the key that
# deployments/testnet.json `function_call_keys` lists for (bridge_account, asset) is read from the
# NEAR CLI keychain (~/.near-credentials). Assets without a key cannot be written to.
signer:
  deployments: ../deployments/testnet.json
assets:
  - asset_id: ${WASHER_ASSET_ID}
    adapter: simulator
    adapter_config: { scenario: ../scenarios/washer.yaml, speed: 60 }
    telemetry_interval_sec: 5
    session_timeout_min: 120
  # Real devices (moonraker / smart_plug) plug in with the Wave 3 adapters, e.g.:
  # - asset_id: ${LASER_ASSET_ID}
  #   adapter: smart_plug
  #   adapter_config: { vendor: shelly_gen2, base_url: http://plug-laser.local, channel: 0 }
  #   safety: { dangerous: true, stand_in: "desk lamp (stand-in for the laser cutter)" }
