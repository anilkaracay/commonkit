# SIMULATION. Cooperative tractor (simulator profile). fuel_level is a gauge (litres); the bridge
# derives fuel_used_l (sum of drops) and refills (rises >= 5 l). A passed check after a Restock
# task finds the tank full again.
scenario: tractor
description: Simulated tractor hours and fuel.
simulated: true
seed: 1913
speed: 600
metrics:
  engine_seconds: { initial: 352800, per_session: 14400, curve: linear }   # 98 h; 4 h jobs
  sessions:       { initial: 40, per_session: 1, curve: step }
  fuel_level:     { type: gauge, initial: 60, per_session: -18, min: 0, max: 80 }
session:
  duration_sec: 14400
  jitter_pct: 15
verification:
  duration_sec: 300
  default: pass
  sets: { fuel_level: 80 }
failures: []
